  <!-- ===== SPOTSHARE SIGN (mounted on wall) ===== -->
  <!-- Sign drop shadow on wall -->
  <rect x="34" y="68" width="6" height="264" fill="#707068" opacity="0.25"/>
  <rect x="34" y="68" width="154" height="5"  fill="#707068" opacity="0.18"/>
  <!-- Sign itself -->
  <image href="parking-sign.svg" xlink:href="parking-sign.svg"
         x="36" y="66" width="152" height="259"/>
  <!-- Mounting screws (4 corners) -->
  <circle cx="42"  cy="73"  r="4.5" fill="#7E7E76"/>
  <circle cx="42"  cy="73"  r="2"   fill="#AAAAAA"/>
  <circle cx="182" cy="73"  r="4.5" fill="#7E7E76"/>
  <circle cx="182" cy="73"  r="2"   fill="#AAAAAA"/>
  <circle cx="42"  cy="318" r="4.5" fill="#7E7E76"/>
  <circle cx="42"  cy="318" r="2"   fill="#AAAAAA"/>
  <circle cx="182" cy="318" r="4.5" fill="#7E7E76"/>
  <circle cx="182" cy="318" r="2"   fill="#AAAAAA"/>

  <!-- ===== PARKING LOT ASPHALT ===== -->
  <rect x="0" y="386" width="900" height="174" fill="url(#asphaltGrad)"/>

  <!-- Asphalt expansion joints -->
  <line x1="0"   y1="420" x2="900" y2="420" stroke="#424242" stroke-width="1.2" opacity="0.4"/>
  <line x1="0"   y1="462" x2="900" y2="462" stroke="#424242" stroke-width="1"   opacity="0.3"/>
  <line x1="0"   y1="510" x2="900" y2="510" stroke="#424242" stroke-width="1"   opacity="0.3"/>

  <!-- Wall-ground junction curb -->
  <rect x="0" y="383" width="226" height="8" fill="#909088"/>

  <!-- ===== PARKING SPACE MARKINGS ===== -->
  <!-- Far line (at wall base) -->
  <rect x="226" y="386" width="674" height="3.5" fill="white" opacity="0.55"/>

  <!-- Left line of active space (car is between left & right) -->
  <rect x="405" y="386" width="3" height="174" fill="white" opacity="0.88"/>
  <!-- Right line of active space -->
  <rect x="672" y="386" width="3" height="174" fill="white" opacity="0.88"/>
  <!-- Adjacent bay lines -->
  <rect x="253" y="386" width="2.5" height="174" fill="white" opacity="0.68"/>
  <rect x="678" y="386" width="2.5" height="174" fill="white" opacity="0.55"/>
  <rect x="835" y="386" width="2.5" height="174" fill="white" opacity="0.55"/>

  <!-- ===== CAR (silver sedan, side view, nose toward wall / left) ===== -->
  <!-- Car shadow on asphalt -->
  <ellipse cx="540" cy="496" rx="132" ry="13" fill="url(#carShadow)"/>

  <!-- Main chassis -->
  <rect x="430" y="430" width="228" height="50" rx="8" fill="#D4D8DE"/>

  <!-- Cabin / roof -->
  <path d="M456,430 L476,392 L578,392 L622,430 Z" fill="#C8CDD4"/>

  <!-- Rear window (left, car faces left so rear is at right x=658) -->
  <!-- Wait: if nose faces LEFT (wall side), front is at x=430, rear at x=658 -->
  <!-- Rear window is at right side of cabin: near x=622 area -->
  <path d="M582,427 L582,396 L616,396 L618,427 Z" fill="#74B4C4" opacity="0.82"/>

  <!-- B-pillar -->
  <rect x="510" y="395" width="5" height="35" fill="#A8ACB4"/>

  <!-- Front window (large, angled – near x=456 area, left/front) -->
  <path d="M462,427 L478,396 L506,396 L506,427 Z" fill="#74B4C4" opacity="0.82"/>

  <!-- Roof highlight -->
  <path d="M474,394 L578,394" stroke="white" stroke-width="1.8" opacity="0.38"/>

  <!-- Side body upper highlight line -->
  <path d="M434,440 Q540,434 654,440" stroke="white" stroke-width="1.4" opacity="0.28"/>

  <!-- Wheel arches (recesses) -->
  <path d="M444,468 Q468,438 492,468" fill="#C8CDD4"/>
  <path d="M588,468 Q612,438 636,468" fill="#C8CDD4"/>

  <!-- Door line -->
  <line x1="518" y1="430" x2="518" y2="470" stroke="#B0B4BC" stroke-width="1.8"/>

  <!-- Front bumper + headlight (LEFT side = front since car faces left) -->
  <rect x="428" y="444" width="7"  height="16" rx="3" fill="#BBC0C8"/>
  <rect x="429" y="432" width="6"  height="14" rx="2" fill="#FFFCE8"/>
  <rect x="430" y="433" width="4"  height="8"  rx="1" fill="#FFE880" opacity="0.8"/>
  <!-- Front grille hint -->
  <rect x="429" y="448" width="5"  height="22" rx="2" fill="#AEB3BB" opacity="0.6"/>

  <!-- Rear bumper + taillight (RIGHT side = rear) -->
  <rect x="653" y="440" width="8"  height="20" rx="3" fill="#BBC0C8"/>
  <rect x="654" y="430" width="6"  height="18" rx="2" fill="#BB1111"/>
  <rect x="655" y="431" width="4"  height="8"  rx="1" fill="#FF4444"/>

  <!-- Front wheel (left, front of car) -->
  <circle cx="468" cy="474" r="23" fill="#242424"/>
  <circle cx="468" cy="474" r="15" fill="#585858"/>
  <circle cx="468" cy="474" r="7"  fill="#303030"/>
  <circle cx="468" cy="474" r="3"  fill="#808080"/>
  <!-- Wheel highlight -->
  <path d="M456,462 Q468,458 480,466" stroke="white" stroke-width="1.2" fill="none" opacity="0.25"/>

  <!-- Rear wheel (right) -->
  <circle cx="612" cy="474" r="23" fill="#242424"/>
  <circle cx="612" cy="474" r="15" fill="#585858"/>
  <circle cx="612" cy="474" r="7"  fill="#303030"/>
  <circle cx="612" cy="474" r="3"  fill="#808080"/>
  <path d="M600,462 Q612,458 624,466" stroke="white" stroke-width="1.2" fill="none" opacity="0.25"/>

  <!-- Subtle wet-asphalt reflection under car -->
  <rect x="435" y="496" width="220" height="18" rx="4"
        fill="#D4D8DE" opacity="0.10"/>

</svg>
