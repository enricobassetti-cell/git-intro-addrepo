  <rect x="88"  y="8"  width="22" height="28" rx="2" fill="#B8C8D4" opacity="0.55"/>
  <rect x="118" y="8"  width="22" height="28" rx="2" fill="#B8C8D4" opacity="0.55"/>
  <rect x="148" y="8"  width="22" height="28" rx="2" fill="#B8C8D4" opacity="0.55"/>
  <rect x="178" y="8"  width="22" height="28" rx="2" fill="#B8C8D4" opacity="0.55"/>
  <!-- Window reflections -->
