  <rect x="688" y="260" width="5" height="6" fill="#C8D5E2" opacity="0.65"/>
  <rect x="668" y="272" width="5" height="6" fill="#C8D5E2" opacity="0.65"/>
  <rect x="688" y="272" width="5" height="6" fill="#C8D5E2" opacity="0.65"/>
  <rect x="750" y="253" width="5" height="6" fill="#C8D5E2" opacity="0.65"/>
