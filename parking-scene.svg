<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3A7BAA"/>
      <stop offset="55%"  stop-color="#85B8D8"/>
      <stop offset="100%" stop-color="#C6DFF0"/>
    </linearGradient>
    <linearGradient id="asphaltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6A6A6A"/>
      <stop offset="100%" stop-color="#484848"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9E9E96"/>
      <stop offset="100%" stop-color="#BCBCB4"/>
    </linearGradient>
    <linearGradient id="farGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7A8C6A"/>
      <stop offset="100%" stop-color="#656E55"/>
