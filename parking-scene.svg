  <rect x="59"  y="9"  width="8"  height="7" rx="1" fill="white" opacity="0.25"/>
  <rect x="89"  y="9"  width="8"  height="7" rx="1" fill="white" opacity="0.25"/>
  <rect x="119" y="9"  width="8"  height="7" rx="1" fill="white" opacity="0.25"/>
