  <rect x="596" y="268" width="5" height="6" fill="#C8D5E2" opacity="0.65"/>
  <rect x="606" y="268" width="5" height="6" fill="#C8D5E2" opacity="0.65"/>
  <rect x="668" y="260" width="5" height="6" fill="#C8D5E2" opacity="0.65"/>
