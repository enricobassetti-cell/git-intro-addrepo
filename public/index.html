<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockPulse — Market Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ── Navigation ─────────────────────────────────────── -->
<nav class="nav">
  <div class="nav__logo">&#9730; <span>StockPulse</span></div>
  <ul class="nav__links">
    <li><a href="/index.html" class="active">Dashboard</a></li>
    <li><a href="/screener.html">Screener</a></li>
    <li><a href="/portfolio.html">Portfolio</a></li>
  </ul>
  <div class="nav__search">
    <svg class="nav__search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search stocks… (AAPL, TSLA)" autocomplete="off" />
    <div class="search-dropdown" id="searchDropdown"></div>
  </div>
  <div class="nav__spacer"></div>
  <a href="/portfolio.html"><button class="nav__btn">&#128202; Portfolio</button></a>
</nav>

<!-- ── Ticker Tape ─────────────────────────────────────── -->
<div class="ticker">
  <div class="ticker__track" id="tickerTrack">
    <div class="ticker__item"><span class="ticker__symbol">Loading…</span></div>
  </div>
</div>

<!-- ── Page ────────────────────────────────────────────── -->
<div class="page">

  <!-- Market Indices -->
  <div class="section-header">
    <span class="section-title">Market Overview</span>
    <span id="marketTime" style="font-size:0.75rem;color:var(--text3)"></span>
  </div>
  <div class="indices-grid" id="indicesGrid">
    <div class="index-card skeleton loading-row"></div>
    <div class="index-card skeleton loading-row"></div>
    <div class="index-card skeleton loading-row"></div>
    <div class="index-card skeleton loading-row"></div>
    <div class="index-card skeleton loading-row"></div>
    <div class="index-card skeleton loading-row"></div>
  </div>

  <!-- Main 2-col grid -->
  <div class="main-grid">

    <!-- LEFT: News -->
    <div>
      <div class="section-header">
        <span class="section-title">Market News</span>
        <span style="font-size:0.75rem;color:var(--text3)" id="newsCount"></span>
      </div>
      <div class="card" style="padding:0 1rem">
        <div id="newsList">
          <div class="loading-rows" style="padding:1rem 0">
            <div class="skeleton loading-row"></div>
            <div class="skeleton loading-row"></div>
            <div class="skeleton loading-row"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Sidebar -->
    <div class="sidebar">

      <!-- Market Movers -->
      <div class="card" style="padding:0.875rem 1rem">
        <div class="tabs">
          <button class="tab-btn active" data-type="active">Most Active</button>
          <button class="tab-btn" data-type="gainers">Gainers</button>
          <button class="tab-btn" data-type="losers">Losers</button>
        </div>
        <div id="moversList">
          <div class="loading-rows">
            <div class="skeleton loading-row"></div>
            <div class="skeleton loading-row"></div>
          </div>
        </div>
      </div>

      <!-- Sector Heatmap -->
      <div class="card" style="padding:0.875rem 1rem">
        <div class="section-header" style="margin-bottom:0.6rem">
          <span class="section-title">Sectors</span>
        </div>
        <div class="sector-grid" id="sectorGrid">
          <div class="skeleton" style="height:56px"></div>
          <div class="skeleton" style="height:56px"></div>
          <div class="skeleton" style="height:56px"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Recommendations -->
  <div style="margin-top:1.5rem">
    <div class="section-header">
      <span class="section-title">Analyst Top Picks</span>
      <a href="/screener.html" class="section-link">Full Screener →</a>
    </div>
    <div class="rec-grid" id="recGrid">
      <div class="index-card skeleton loading-row"></div>
      <div class="index-card skeleton loading-row"></div>
      <div class="index-card skeleton loading-row"></div>
      <div class="index-card skeleton loading-row"></div>
    </div>
  </div>

</div>

<!-- Footer -->
<footer class="footer">
  <span>Data provided by Yahoo Finance via yahoo-finance2. For informational purposes only — not financial advice.</span>
  <span>StockPulse &copy; 2026</span>
</footer>

<script type="module" src="/js/index.js"></script>
</body>
</html>
