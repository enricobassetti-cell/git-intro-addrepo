<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Detail — StockPulse</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav__logo">&#9730; <span>StockPulse</span></div>
  <ul class="nav__links">
    <li><a href="/index.html">Dashboard</a></li>
    <li><a href="/screener.html">Screener</a></li>
    <li><a href="/portfolio.html">Portfolio</a></li>
  </ul>
  <div class="nav__search">
    <svg class="nav__search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search stocks…" autocomplete="off" />
    <div class="search-dropdown" id="searchDropdown"></div>
  </div>
  <div class="nav__spacer"></div>
  <a href="/portfolio.html"><button class="nav__btn">&#128202; Portfolio</button></a>
</nav>

<div class="page page--noticker">

  <!-- Breadcrumb -->
  <div style="margin-bottom:1rem;font-size:0.8rem;color:var(--text3)">
    <a href="/screener.html" style="color:var(--text3)">Screener</a> &rsaquo; <span id="breadSymbol">—</span>
  </div>

  <!-- Stock Header -->
  <div class="stock-header" id="stockHeader">
    <div class="stock-header__info">
      <div class="stock-header__symbol" id="symbolLabel">Loading…</div>
      <div class="stock-header__name" id="nameLabel"></div>
      <div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap">
        <span class="stock-header__price" id="priceLabel">—</span>
        <span class="stock-header__change" id="changeLabel"></span>
      </div>
      <div style="font-size:0.78rem;color:var(--text3);margin-top:0.3rem" id="exchangeLabel"></div>
    </div>
    <div class="stock-header__actions" style="flex-wrap:wrap;gap:0.5rem">
      <div class="period-btns" id="periodBtns">
        <button class="period-btn" data-period="1d">1D</button>
        <button class="period-btn" data-period="5d">5D</button>
        <button class="period-btn active" data-period="1mo">1M</button>
        <button class="period-btn" data-period="3mo">3M</button>
        <button class="period-btn" data-period="6mo">6M</button>
        <button class="period-btn" data-period="1y">1Y</button>
        <button class="period-btn" data-period="2y">2Y</button>
      </div>
      <button class="btn btn-primary" id="addToPortfolio">+ Add to Portfolio</button>
    </div>
  </div>

  <!-- Price Chart -->
  <div class="card" style="padding:1rem">
    <div class="chart-wrap">
      <canvas id="priceChart"></canvas>
    </div>
    <!-- Volume chart -->
    <div style="position:relative;height:60px;margin-top:4px">
      <canvas id="volChart"></canvas>
    </div>
  </div>

  <!-- Key Stats -->
  <div style="margin-top:1rem">
    <div class="section-title" style="margin-bottom:0.5rem">Key Statistics</div>
    <div class="stats-grid" id="statsGrid">
      <div class="skeleton" style="height:60px"></div>
      <div class="skeleton" style="height:60px"></div>
      <div class="skeleton" style="height:60px"></div>
      <div class="skeleton" style="height:60px"></div>
    </div>
  </div>

  <div class="main-grid" style="margin-top:1.25rem">

    <!-- LEFT -->
    <div>
      <!-- About -->
      <div class="card" style="padding:1rem;margin-bottom:1rem" id="aboutCard">
        <h3 style="margin-bottom:0.6rem">About</h3>
        <p id="aboutText" style="color:var(--text2);font-size:0.875rem;line-height:1.7">—</p>
        <div style="display:flex;gap:1.5rem;margin-top:0.75rem;flex-wrap:wrap" id="aboutMeta"></div>
      </div>

      <!-- Analyst Recommendations -->
      <div class="card" style="padding:1rem;margin-bottom:1rem">
        <h3 style="margin-bottom:0.6rem">Analyst Recommendations</h3>
        <div class="analyst-summary" id="analystSummary">
          <div class="empty-state" style="padding:0.5rem">Loading…</div>
        </div>
      </div>

      <!-- Related News -->
      <div class="card" style="padding:0 1rem">
        <div class="section-header" style="padding-top:1rem">
          <h3>Related News</h3>
        </div>
        <div id="stockNewsList">
          <div class="loading-rows" style="padding:1rem 0">
            <div class="skeleton loading-row"></div>
            <div class="skeleton loading-row"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Financials sidebar -->
    <div>
      <div class="card" style="padding:1rem">
        <h3 style="margin-bottom:0.75rem">Financial Data</h3>
        <div id="financialsGrid"></div>
      </div>
    </div>

  </div>

</div>

<!-- Add to Portfolio Modal -->
<div class="modal-overlay" id="portfolioModal">
  <div class="modal">
    <h3>Add to Portfolio</h3>
    <div id="modalSymbolInfo" style="margin-bottom:1rem;padding:0.75rem;background:var(--bg3);border-radius:var(--radius-sm)">
      <span id="modalSymbol" style="font-family:monospace;font-weight:700;font-size:1rem"></span>
      <span id="modalPrice" style="float:right;font-family:monospace"></span>
    </div>
    <div class="form-row">
      <label class="form-label">Purchase Price (USD)</label>
      <input type="number" class="form-input" id="buyPriceInput" step="0.01" min="0" placeholder="0.00" />
    </div>
    <div class="form-row">
      <label class="form-label">Number of Shares</label>
      <input type="number" class="form-input" id="sharesInput" step="1" min="1" placeholder="1" />
    </div>
    <div class="form-row">
      <label class="form-label">Purchase Date</label>
      <input type="date" class="form-input" id="buyDateInput" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="confirmAdd">Add to Portfolio</button>
    </div>
  </div>
</div>

<footer class="footer">
  <span>Data provided by Yahoo Finance · For informational purposes only</span>
  <span>StockPulse &copy; 2026</span>
</footer>

<script type="module" src="/js/stock.js"></script>
</body>
</html>
